<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My Media{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f4f8; color: #222; }
    nav { background: #222; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    nav a { color: white; text-decoration: none; margin-left: 20px; }
    nav .brand { font-size: 20px; font-weight: bold; margin-left: 0; }
    main { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .card img, .card video { width: 100%; border-radius: 6px; }
    .card audio { width: 100%; }
    .card h3 { margin-top: 0; }
    form p { display: flex; flex-direction: column; margin-bottom: 15px; }
    input, select { padding: 8px; margin-top: 5px; }
    button { background: #4a6cf7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #3a58d6; }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="{% url 'home' %}">My Media</a>
    <div>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'upload' %}">Upload</a>
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
